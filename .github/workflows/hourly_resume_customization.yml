name: Resume Customization

on:
  schedule:
    # Runs every 4 hours (runs 30 mins after job scorer evaluates fresh jobs)
    - cron: "30 */4 * * *"
  workflow_dispatch: # Allows manual triggering from the Actions tab in GitHub

jobs:
  customize_resumes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (Active LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Run resume customization script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run customize
