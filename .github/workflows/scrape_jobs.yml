# .github/workflows/scrape_jobs.yml
name: Daily Job Scraper

on:
  schedule:
    - cron: "0 11 * * *"   # 7:00 PM SGT (Once daily, captures past 24 hours of job postings)
  workflow_dispatch:

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      include_linkedin: ${{ steps.get-queries.outputs.include_linkedin }}
      include_careers_future: ${{ steps.get-queries.outputs.include_careers_future }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: npm --prefix web install

      - name: Extract search queries and sources from Supabase
        id: get-queries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx --prefix web tsx -e "
            import { createSupabaseStaticClient } from './web/src/utils/supabase/server';
            import { loadScraperSettings } from './web/src/lib/scraper';
            import fs from 'fs';
            async function main() {
              const supabase = createSupabaseStaticClient();
              const settings = await loadScraperSettings(supabase);
              const hasLinkedin = settings.scrapingSources.includes('linkedin') && settings.linkedinQueries.length > 0;
              const hasCf = settings.scrapingSources.includes('careers_future') && (settings.careersFutureQueries.length > 0 || settings.linkedinQueries.length > 0);
              const out = [
                'include_linkedin=' + String(hasLinkedin),
                'include_careers_future=' + String(hasCf)
              ].join('\n');
              if (process.env.GITHUB_OUTPUT) {
                fs.appendFileSync(process.env.GITHUB_OUTPUT, out + '\n');
              } else {
                console.log(out);
              }
            }
            main();
          "

  scrape-linkedin:
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.include_linkedin == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: npm --prefix web install

      - name: Run LinkedIn scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape -- --source linkedin

  scrape-careers-future:
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.include_careers_future == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install dependencies
        run: npm --prefix web install

      - name: Run CareersFuture scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run scrape -- --source careers_future
