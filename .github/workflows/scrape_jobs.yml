# .github/workflows/scrape_jobs.yml
name: Daily Job Scraper

on:
  schedule:
    - cron: "0 11 * * *"   # 7:00 PM SGT (Once daily, captures past 24 hours of job postings)
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      linkedin_queries: ${{ steps.get-queries.outputs.linkedin_queries }}
      include_careers_future: ${{ steps.get-queries.outputs.include_careers_future }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract search queries and sources from Supabase
        id: get-queries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "import supabase_utils, config, json; supabase_utils.load_and_apply_app_settings(); l_queries = config.LINKEDIN_SEARCH_QUERIES if 'linkedin' in config.SCRAPING_SOURCES else []; print('linkedin_queries=' + json.dumps(l_queries)); print('include_careers_future=' + str('careers_future' in config.SCRAPING_SOURCES).lower())" >> $GITHUB_OUTPUT

  scrape-linkedin:
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.linkedin_queries != '[]' && needs.prepare-matrix.outputs.linkedin_queries != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2 # Limits concurrent workers hitting LinkedIn and Supabase
      matrix:
        query: ${{ fromJson(needs.prepare-matrix.outputs.linkedin_queries) }}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LinkedIn scraper for query
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper.py --source linkedin --query "${{ matrix.query }}"

  scrape-careers-future:
    needs: prepare-matrix
    if: ${{ needs.prepare-matrix.outputs.include_careers_future == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CareersFuture scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper.py --source careers_future
